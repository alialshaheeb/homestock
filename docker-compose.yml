name: homestock

services:
  # One SQL Server holding one database per service (locally; on Azure each is its own serverless DB).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64          # no arm64 image: on Apple Silicon enable Rosetta in Docker Desktop
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql      # data survives `docker compose down`; `down -v` wipes it
    ports:
      - "1433:1433"                 # only so tests on your machine can reach it
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # One-off job: creates both databases and their logins (idempotent), then exits.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      RESTOCK_DB_PASSWORD: ${RESTOCK_DB_PASSWORD}
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P "$$SA_PASSWORD" -i /init.sql -v INVENTORY_DB_PASSWORD="$$INVENTORY_DB_PASSWORD" RESTOCK_DB_PASSWORD="$$RESTOCK_DB_PASSWORD"

  inventory:
    build: ./services/inventory
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://inventory_user:${INVENTORY_DB_PASSWORD}@sqlserver:1433/inventory
      CORS_ORIGINS: ${UI_ORIGIN:-http://localhost:8080}
    ports:
      - "8001:8000"

  restock:
    build: ./services/restock
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://restock_user:${RESTOCK_DB_PASSWORD}@sqlserver:1433/restock
      INVENTORY_URL: http://inventory:8000     # the compose service name, not localhost
      INVENTORY_TIMEOUT_S: "2"
      CORS_ORIGINS: ${UI_ORIGIN:-http://localhost:8080}
    ports:
      - "8002:8000"

  # Stock web server with the ui/ folder mounted: serves static files, not a service container.
  ui:
    image: nginx:alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  sqldata:
